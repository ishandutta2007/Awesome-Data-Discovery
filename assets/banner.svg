<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ac" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"><animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#818cf8"><animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#c084fc"><animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/></pattern>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 50px; fill: url(#ac); letter-spacing: -1px; }
    .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 19px; fill: #94a3b8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; letter-spacing: 2px; text-transform: uppercase; }
    .b { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; }
    .st { stroke-dasharray: 8, 8; animation: flow 20s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }
  </style>
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="16" fill="url(#g)"/>
  <g opacity="0.35">
    <path class="st" d="M 100 80 Q 300 20 500 120 T 900 60 T 1150 140" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="st" d="M 50 280 Q 350 320 650 220 T 1000 300 T 1180 240" fill="none" stroke="#818cf8" stroke-width="2"/>
    <path class="st" d="M 80 180 Q 400 260 750 140 T 1120 200" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="100" cy="80" r="5" fill="#38bdf8"><animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="120" r="6" fill="#818cf8"><animate attributeName="r" values="5;8;5" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="60" r="5" fill="#c084fc"><animate attributeName="r" values="4;7;4" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="220" r="7" fill="#38bdf8"><animate attributeName="r" values="5;9;5" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="300" r="6" fill="#818cf8"><animate attributeName="r" values="4;8;4" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(1020, 180)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#ac)" stroke-width="1.5" opacity="0.4" stroke-dasharray="6,6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="30" fill="url(#ac)" opacity="0.8" filter="url(#gl)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-3" cy="-3" r="14" fill="none" stroke="#0f172a" stroke-width="3.5"/>
    <line x1="8" y1="8" x2="19" y2="19" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(70, 75)">
    <text x="0" y="20" class="tag">🔍 The Comprehensive Open Landscape</text>
    <text x="0" y="75" class="t">Awesome Data Discovery</text>
    <text x="0" y="120" class="s">Curated Guide to Data Discovery, Catalogs, Active Metadata &amp; AI Data Context</text>
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="150" height="34" rx="17" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
      <text x="75" y="22" class="b" text-anchor="middle" fill="#38bdf8">🗂️ Data Catalogs</text>
      <rect x="162" y="0" width="165" height="34" rx="17" fill="rgba(129, 140, 248, 0.12)" stroke="#818cf8" stroke-width="1"/>
      <text x="244" y="22" class="b" text-anchor="middle" fill="#818cf8">🌐 Active Metadata</text>
      <rect x="339" y="0" width="150" height="34" rx="17" fill="rgba(192, 132, 252, 0.12)" stroke="#c084fc" stroke-width="1"/>
      <text x="414" y="22" class="b" text-anchor="middle" fill="#c084fc">⚡ Data Lineage</text>
      <rect x="501" y="0" width="165" height="34" rx="17" fill="rgba(45, 212, 191, 0.12)" stroke="#2dd4bf" stroke-width="1"/>
      <text x="583" y="22" class="b" text-anchor="middle" fill="#2dd4bf">🤖 AI Context &amp; MCP</text>
      <rect x="678" y="0" width="160" height="34" rx="17" fill="rgba(251, 146, 60, 0.12)" stroke="#fb923c" stroke-width="1"/>
      <text x="758" y="22" class="b" text-anchor="middle" fill="#fb923c">🛡️ Data Governance</text>
    </g>
  </g>
</svg>
